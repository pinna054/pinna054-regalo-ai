<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Gifty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Layout: one-screen mobile app, centred column max 460px. Single committed theme: pine night + fox orange. */
  :root{
    --pine:#0e1a16;      /* background */
    --moss:#17271f;      /* surfaces */
    --fern:#22382d;      /* raised surfaces / borders */
    --fox:#ff7a2f;       /* brand accent */
    --ember:#ffb37a;     /* soft accent */
    --snow:#f6efe6;      /* text */
    --lichen:#a9b8ad;    /* muted text */
    --yes:#5fe0a8; --no:#ff6b6b; --super:#ffd36b;
    --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
    --body:"Figtree", "Segoe UI", system-ui, sans-serif;
    --r:26px;
    color-scheme:dark;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--pine);color:var(--snow);font-family:var(--body);display:flex;justify-content:center;overflow:hidden;-webkit-font-smoothing:antialiased}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(700px 420px at 85% -5%,rgba(255,122,47,.20),transparent 60%),
               radial-gradient(600px 400px at -10% 105%,rgba(95,224,168,.10),transparent 60%)}
  button{font-family:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--ember);outline-offset:3px}
  .app{position:relative;width:100%;max-width:460px;height:100%;display:flex;flex-direction:column;padding:14px 18px 18px}

  header{display:flex;align-items:center;justify-content:space-between;gap:12px;height:44px;flex-shrink:0}
  .brand{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:800;font-size:23px;letter-spacing:-.6px;background:none;border:0;cursor:pointer}
  .brand b{color:var(--fox)}
  .hdr-right{display:flex;gap:8px;align-items:center}
  .pill{background:var(--moss);border:1px solid var(--fern);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer}
  .likes{display:none;align-items:center;gap:6px}
  .likes.on{display:flex}

  .screen{flex:1;display:none;flex-direction:column;min-height:0;animation:in .35s ease}
  .screen.active{display:flex}
  @keyframes in{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* Welcome */
  .hero{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px}
  .hero-fox{width:118px;height:118px;filter:drop-shadow(0 18px 30px rgba(255,122,47,.35));animation:bob 4s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-6px) rotate(-2deg)}}
  .hero h1{font-family:var(--display);font-size:clamp(36px,10vw,48px);line-height:.98;letter-spacing:-1.5px;text-wrap:balance}
  .hero h1 em{font-style:normal;color:var(--fox)}
  .hero p{color:var(--lichen);font-size:17px;line-height:1.45;max-width:34ch}
  .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .step{background:var(--moss);border:1px solid var(--fern);border-radius:16px;padding:12px 10px}
  .step span{display:block;font-family:var(--display);font-weight:800;color:var(--fox);font-size:13px;margin-bottom:4px}
  .step small{font-size:13px;color:var(--snow);line-height:1.3;display:block}

  .cta{background:var(--fox);color:#1d0d03;border:0;border-radius:18px;padding:17px 18px;font-size:17px;font-weight:700;cursor:pointer;box-shadow:0 10px 30px rgba(255,122,47,.35);transition:transform .12s, opacity .2s}
  .cta:active{transform:scale(.98)}
  .cta:disabled{opacity:.35;box-shadow:none;cursor:not-allowed}
  .cta.ghost{background:transparent;color:var(--snow);border:1px solid var(--fern);box-shadow:none}
  .demo-note{font-size:12.5px;color:var(--lichen);text-align:center;margin-top:10px;min-height:16px}

  /* Questions */
  .qtop{display:flex;align-items:center;gap:12px;margin:10px 0 18px}
  .back{width:38px;height:38px;border-radius:12px;background:var(--moss);border:1px solid var(--fern);cursor:pointer;font-size:17px;flex-shrink:0}
  .dots{display:flex;gap:5px;flex:1}
  .dots i{height:5px;flex:1;border-radius:5px;background:var(--fern);transition:background .3s}
  .dots i.done{background:var(--fox)}
  .qnum{font-size:12.5px;color:var(--lichen);font-variant-numeric:tabular-nums;white-space:nowrap}
  .qbody{flex:1;display:flex;flex-direction:column;min-height:0;overflow:auto}
  .qemoji{font-size:40px;margin-bottom:10px}
  .qbody h2{font-family:var(--display);font-size:clamp(26px,7.4vw,32px);line-height:1.08;letter-spacing:-.8px;text-wrap:balance}
  .qhint{color:var(--lichen);margin:10px 0 20px;font-size:15px;line-height:1.4}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .opt{text-align:left;background:var(--moss);border:1.5px solid var(--fern);border-radius:18px;padding:14px 14px;font-size:15px;font-weight:600;cursor:pointer;line-height:1.25;transition:border-color .15s, background .15s, transform .1s;min-height:58px}
  .opt:active{transform:scale(.98)}
  .opt.on{border-color:var(--fox);background:rgba(255,122,47,.14)}
  .free{margin-top:12px;display:flex;gap:8px}
  .free input{flex:1;min-width:0;background:var(--moss);border:1.5px solid var(--fern);border-radius:16px;padding:13px 14px;color:var(--snow);font:inherit;font-size:15px}
  .free input::placeholder{color:#7f9085}
  .qfoot{display:flex;flex-direction:column;gap:8px;padding-top:14px}
  .skip{background:none;border:0;color:var(--ember);font-weight:600;font-size:14px;cursor:pointer;padding:6px}

  /* Thinking */
  .thinking{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
  .thinking svg{width:84px;height:84px;animation:sniff 1.1s ease-in-out infinite}
  @keyframes sniff{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg) translateY(-3px)}}
  .thinking p{font-family:var(--display);font-size:20px;font-weight:700}
  .thinking small{color:var(--lichen);font-size:14px;max-width:30ch}
  .err{color:var(--no);font-size:14px;max-width:32ch}

  /* Deck */
  .deck{position:relative;flex:1;min-height:0;margin-top:8px}
  .card{position:absolute;inset:0;border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;touch-action:none;user-select:none;will-change:transform;
        box-shadow:0 24px 50px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.06);background:var(--moss);transition:transform .3s ease}
  .art{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-height:0}
  .art::after{content:"";position:absolute;inset:0;opacity:.22;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence baseFrequency='.9' numOctaves='3'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
  .art .em{font-size:clamp(92px,28vw,130px);filter:drop-shadow(0 18px 24px rgba(0,0,0,.45));animation:float 5s ease-in-out infinite;position:relative;z-index:1}
  @keyframes float{50%{transform:translateY(-8px) rotate(3deg)}}
  .price-tag{position:absolute;top:16px;right:16px;z-index:2;background:rgba(14,26,22,.72);backdrop-filter:blur(8px);border-radius:999px;padding:7px 12px;font-weight:700;font-variant-numeric:tabular-nums;font-size:15px}
  .new-tag{position:absolute;top:16px;left:16px;z-index:2;background:rgba(246,239,230,.92);color:#1d0d03;border-radius:999px;padding:6px 11px;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
  .info{padding:18px 20px 20px;background:var(--moss);display:flex;flex-direction:column;gap:8px}
  .info h3{font-family:var(--display);font-size:25px;line-height:1.05;letter-spacing:-.6px;text-wrap:balance}
  .info .tl{color:var(--ember);font-weight:600;font-size:14.5px}
  .info p{color:#cdd6cf;font-size:14.5px;line-height:1.45}
  .why{display:flex;gap:8px;align-items:flex-start;background:rgba(95,224,168,.09);border:1px solid rgba(95,224,168,.22);border-radius:14px;padding:10px 12px;font-size:13.5px;line-height:1.4;color:#d6f5e6}
  .why svg{flex-shrink:0;width:18px;height:18px;margin-top:1px}
  .tags{display:flex;gap:6px;flex-wrap:wrap}
  .tag{font-size:12px;background:var(--fern);padding:4px 10px;border-radius:999px;color:#d3ddd6}
  .stamp{position:absolute;z-index:3;top:30px;padding:6px 14px;border:4px solid;border-radius:12px;font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:.02em;opacity:0;text-transform:uppercase;background:rgba(14,26,22,.35)}
  .stamp.yes{left:22px;color:var(--yes);transform:rotate(-14deg)}
  .stamp.no{right:22px;color:var(--no);transform:rotate(14deg)}
  .stamp.super{left:50%;top:auto;bottom:22px;transform:translateX(-50%) rotate(-5deg);color:var(--super)}
  .loading-card{position:absolute;inset:0;border-radius:var(--r);background:var(--moss);border:1px dashed var(--fern);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--lichen);text-align:center;padding:24px}
  .loading-card svg{width:64px;height:64px;animation:sniff 1.1s ease-in-out infinite}

  .actions{display:flex;justify-content:center;align-items:center;gap:16px;padding-top:16px}
  .btn{border:1px solid var(--fern);border-radius:50%;background:var(--moss);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .12s, background .15s}
  .btn:active{transform:scale(.88)}
  .btn svg{width:46%;height:46%}
  .btn.big{width:68px;height:68px}
  .btn.small{width:50px;height:50px}
  .btn.no{color:var(--no)} .btn.yes{color:var(--yes)} .btn.super{color:var(--super)} .btn.undo{color:var(--lichen)} .btn.done{color:var(--fox)}
  .hint{text-align:center;color:var(--lichen);font-size:12px;margin-top:10px}

  /* Results */
  .res-head{margin:12px 0 14px}
  .res-head h2{font-family:var(--display);font-size:32px;letter-spacing:-1px;line-height:1}
  .res-head p{color:var(--lichen);margin-top:8px;font-size:15px}
  .list{overflow:auto;flex:1;display:flex;flex-direction:column;gap:10px;padding-bottom:12px}
  .row{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;background:var(--moss);border:1px solid var(--fern);border-radius:20px;padding:14px}
  .row.top{border-color:rgba(255,122,47,.55);background:linear-gradient(160deg,rgba(255,122,47,.13),var(--moss) 60%)}
  .row .e{width:60px;height:60px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:32px}
  .row h4{font-family:var(--display);font-size:18px;line-height:1.1;letter-spacing:-.3px}
  .row .meta{display:flex;gap:8px;align-items:center;margin:4px 0 6px;flex-wrap:wrap}
  .row .pr{font-weight:700;font-variant-numeric:tabular-nums;color:var(--ember)}
  .row .badge{font-size:11px;font-weight:700;color:#1d0d03;background:var(--super);border-radius:999px;padding:2px 8px}
  .row p{font-size:13.5px;color:#cdd6cf;line-height:1.4}
  .row a{display:inline-block;margin-top:8px;color:var(--fox);font-weight:700;font-size:13.5px;text-decoration:none}
  .row a:hover{text-decoration:underline}
  .res-actions{display:flex;flex-direction:column;gap:8px}

  .toast{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);background:var(--snow);color:#1d0d03;padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;white-space:nowrap;z-index:50}
  .toast.on{opacity:1}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  /* ===== Gioco: domande da scorrere, Conosciometro, foto vere ===== */
  .demo-pill{display:none;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--super);border-color:rgba(255,211,107,.35);cursor:default}
  .demo-pill.on{display:inline-flex}
  .qcard{background:radial-gradient(420px 300px at 80% 0%,rgba(255,122,47,.22),transparent 60%),linear-gradient(170deg,var(--fern),var(--moss) 60%)}
  .qcard.r2{background:radial-gradient(420px 300px at 15% 0%,rgba(95,224,168,.20),transparent 60%),linear-gradient(170deg,var(--fern),var(--moss) 60%)}
  .qart{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:56px 26px 34px;text-align:center}
  .qart .em{font-size:clamp(72px,22vw,98px);filter:drop-shadow(0 16px 22px rgba(0,0,0,.45));animation:float 5s ease-in-out infinite}
  .qart h3{font-family:var(--display);font-size:clamp(25px,7.2vw,31px);line-height:1.1;letter-spacing:-.7px;text-wrap:balance}
  .qmeta{position:absolute;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--lichen)}
  .qmeta b{background:rgba(246,239,230,.92);color:#1d0d03;border-radius:999px;padding:6px 11px}
  .stamp.idk{left:50%;top:auto;bottom:22px;transform:translateX(-50%) rotate(-5deg);color:var(--super)}
  .btn.idk{color:var(--super);font-family:var(--display);font-weight:800;font-size:22px}
  .skipq{display:block;margin:6px auto 0;background:none;border:0;color:var(--ember);font-weight:600;font-size:14px;cursor:pointer;padding:6px;visibility:hidden}
  .skipq.on{visibility:visible}
  .art.photo{background-size:cover!important;background-position:center!important}
  .art.photo::after{display:none}
  .art.photo::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,26,22,.35),transparent 35%,transparent 70%,rgba(14,26,22,.55));z-index:1}
  .art.photo .em{display:none}
  .credit{position:absolute;left:12px;bottom:10px;z-index:2;font-size:11px;color:rgba(246,239,230,.9);text-decoration:none;background:rgba(14,26,22,.6);padding:3px 9px;border-radius:999px}
  .row .e.photo{background-size:cover!important;background-position:center!important}
  .score{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;overflow:auto;padding:8px 0 14px}
  .score .kicker{font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--lichen)}
  .ring{--p:0;width:172px;height:172px;border-radius:50%;background:conic-gradient(var(--fox) calc(var(--p)*1%),var(--fern) 0);display:grid;place-items:center;position:relative;box-shadow:0 18px 44px rgba(255,122,47,.28);flex-shrink:0}
  .ring::before{content:"";position:absolute;inset:13px;border-radius:50%;background:var(--pine)}
  .ring span{position:relative;font-family:var(--display);font-weight:800;font-size:48px;letter-spacing:-1.5px;font-variant-numeric:tabular-nums}
  .score h2{font-family:var(--display);font-size:clamp(26px,7.5vw,32px);letter-spacing:-.8px;line-height:1.05;text-wrap:balance}
  .lvl{color:var(--ember);font-weight:700;font-size:16px;text-wrap:balance}
  .portrait{background:var(--moss);border:1px solid var(--fern);border-radius:18px;padding:14px 16px;font-size:15px;line-height:1.45;color:#d6e0d9;max-width:36ch;display:flex;gap:10px;text-align:left;align-items:flex-start}
  .portrait svg{width:26px;height:26px;flex-shrink:0}
  .portrait.wait svg{animation:sniff 1.1s ease-in-out infinite}
  .badges{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .badges span{background:rgba(255,211,107,.10);border:1px solid rgba(255,211,107,.35);color:var(--super);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
  .res-score{display:inline-block;margin-top:8px;font-size:13px;font-weight:700;color:var(--ember)}
</style>
</head>
<body>
<!-- Logo: volpe geometrica originale -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="fox" viewBox="0 0 64 64">
    <polygon points="9,5 25,21 12,29" fill="#ff7a2f"/>
    <polygon points="55,5 39,21 52,29" fill="#ff7a2f"/>
    <polygon points="12.5,11 21,21 14,25" fill="#7a2a0c"/>
    <polygon points="51.5,11 43,21 50,25" fill="#7a2a0c"/>
    <polygon points="7,24 32,17 57,24 47,44 32,59 17,44" fill="#ff7a2f"/>
    <polygon points="32,17 57,24 47,44 32,59" fill="#e5621c"/>
    <polygon points="7,24 17,44 32,59 25,41" fill="#f6efe6"/>
    <polygon points="57,24 47,44 32,59 39,41" fill="#e9dfd2"/>
    <polygon points="28.5,54.5 35.5,54.5 32,59.5" fill="#0e1a16"/>
    <polygon points="19,31 27,33 21,35.5" fill="#0e1a16"/>
    <polygon points="45,31 37,33 43,35.5" fill="#0e1a16"/>
  </symbol>
</svg>

<div class="app">
  <header>
    <button class="brand" id="homeBtn" aria-label="Gifty">
      <svg width="34" height="34"><use href="#fox"/></svg>Gifty
    </button>
    <div class="hdr-right">
      <span class="pill demo-pill" id="demoPill">Demo</span>
      <span class="pill likes" id="likesPill">♥ <span id="likesN">0</span></span>
      <button class="pill" id="langBtn">EN</button>
    </div>
  </header>

  <!-- Benvenuto -->
  <section class="screen active" id="sHome">
    <div class="hero">
      <svg class="hero-fox" viewBox="0 0 64 64"><use href="#fox"/></svg>
      <h1 data-i="heroTitle"></h1>
      <p data-i="heroSub"></p>
      <div class="steps">
        <div class="step"><span>01</span><small data-i="st1"></small></div>
        <div class="step"><span>02</span><small data-i="st2"></small></div>
        <div class="step"><span>03</span><small data-i="st3"></small></div>
      </div>
    </div>
    <button class="cta" id="goBtn" data-i="go"></button>
    <div class="demo-note" id="demoNote"></div>
  </section>

  <!-- Domande con i pulsanti: per chi, occasione, budget, nome e la domanda aperta -->
  <section class="screen" id="sQ">
    <div class="qtop">
      <button class="back" id="qBack" aria-label="Back">←</button>
      <div class="dots" id="dots"></div>
      <span class="qnum" id="qnum"></span>
    </div>
    <div class="qbody" id="qbody"></div>
    <div class="qfoot">
      <button class="cta" id="qNext" disabled data-i="next"></button>
      <button class="skip" id="qSkip"></button>
    </div>
  </section>

  <!-- Il gioco: domande da scorrere -->
  <section class="screen" id="sSwipe">
    <div class="deck" id="qdeck"></div>
    <div class="actions">
      <button class="btn big no" id="qNoBtn" aria-label="No"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      <button class="btn small idk" id="qIdkBtn" aria-label="?">?</button>
      <button class="btn big yes" id="qYesBtn" aria-label="Yes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17.5 19 7"/></svg></button>
    </div>
    <div class="hint" data-i="swipeHint"></div>
    <button class="skipq" id="qEnough" data-i="enough"></button>
  </section>

  <!-- Conosciometro -->
  <section class="screen" id="sScore">
    <div class="score">
      <div class="kicker" data-i="scoreKicker"></div>
      <div class="ring" id="ring"><span id="scorePct">0%</span></div>
      <h2 id="scoreTitle"></h2>
      <div class="lvl" id="scoreLevel"></div>
      <div class="portrait wait" id="portrait"></div>
      <div class="badges" id="badges"></div>
    </div>
    <div class="res-actions">
      <button class="cta" id="giftsBtn" data-i="showGifts"></button>
      <button class="cta ghost" id="shareBtn" data-i="challenge"></button>
    </div>
  </section>

  <!-- Regali da scorrere -->
  <section class="screen" id="sDeck">
    <div class="deck" id="deck"></div>
    <div class="actions">
      <button class="btn small undo" id="undoBtn" aria-label="Undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
      <button class="btn big no" id="noBtn" aria-label="No"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      <button class="btn small super" id="superBtn" aria-label="Perfect"><svg viewBox="0 0 24 24" fill="currentColor"><path d="m12 2 2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 21l1.6-7L2 9.2l7.1-.6z"/></svg></button>

</div>

    new:"Fresh idea",resTitle:"Your gifts",resSub:n=>`${n} ideas saved, best one on top.`,
    resNone:"You haven't saved any ideas yet. Keep swiping!",more:"Invent more ideas",restart:"New person",
    search:"Search online →",super:"★ Perfect",demo:"Demo mode: sample questions and gifts, AI is off.",
    errAI:"The fox got lost. Try again in a moment.",retry:"Try again",saved:"Saved ♥",
    nameQ:"What's their name?",nameHint:"It stays on your phone: it just makes the game more fun.",namePh:"Name or nickname",nameSkip:"I'd rather not say",

    scoreKicker:"Know-o-meter",scoreTitle:"How well you know {nome}",
    levels:[[100,"Certified soulmate 🏆"],[80,"You know {nome} inside out 🦊"],[60,"Not bad, but some secrets escape you 👀"],[40,"Do you… actually know each other? 😅"],[0,"Who is this person? 🕵️"]],
    portraitWait:"The fox is adding it all up…",showGifts:"See the gifts",challenge:"Challenge a friend",
    shareText:(p,n)=>`I know ${n} ${p}% 🦊 How well do you know your friends? Play on Gifty:`,copied:"Link copied!",
    resScore:(p,n)=>`Know-o-meter: ${p}% on ${n}`,photo:"Photo",
    anon:{"Partner":"your other half","Mom":"your mom","Dad":"your dad"},anonDefault:"this person",
    fixed:[
      {emoji:"🎁",question:"Who is the gift for?",hint:"Let's start with how you know them.",options:["Partner","Mom","Dad","Friend","Colleague","Son/Daughter","Grandparent","Sibling"],multi:false},
      {emoji:"🗓️",question:"What's the occasion?",hint:"It changes the tone of the gift a lot.",options:["Birthday","Christmas","Anniversary","Graduation","Thank you","Just because"],multi:false},
      {emoji:"💶",question:"How much do you want to spend?",hint:"We'll stay within this budget.",options:["Up to €30","€30–70","€70–150","€150–300","Over €300"],multi:false}]}
};
let lang="it";
const t=k=>T[lang][k];
const BATCH=6, MIN_SWIPES=5;

/* ===================== Stato ===================== */
// mode: "fixed" (3 domande base) · "name" · "open" (domanda aperta)
const S={mode:"fixed",answers:[],current:null,nome:"",nameDone:false,
  round:0,qdeck:[],swipes:[],asked:[],open:null,openAnswer:null,prefetch:null,loadingQ:false,errorQ:false,
  deck:[],shown:[],liked:[],disliked:[],history:[],loadingGifts:false,genId:0,portrait:null,badges:[],score:null,demo:false};

/* ===================== Utilità ===================== */
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hex=c=>/^#[0-9a-f]{6}$/i.test(c||"")?c:null;
const pick=a=>a[Math.floor(Math.random()*a.length)];
function toast(msg,ms=1300){const el=$("toast");el.textContent=msg;el.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("on"),ms)}
function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("active",s.id===id));$("likesPill").classList.toggle("on",id==="sDeck"||id==="sRes")}
function applyTexts(){document.querySelectorAll("[data-i]").forEach(el=>{const v=t(el.dataset.i);if(typeof v==="string")el.innerHTML=v})}
const foxSVG='<svg viewBox="0 0 64 64"><use href="#fox"/></svg>';
function setDemo(on){S.demo=on;$("demoPill").classList.toggle("on",on);$("demoNote").textContent=on?t("demo"):""}

/* Il nome resta nel browser: nei testi scambiati con il server c'è il segnaposto {nome}. */
function displayName(){
  if(S.nome)return S.nome;
  const rel=S.answers[0]&&S.answers[0].a[0];
  return (t("anon")[rel])||t("anonDefault");
}
function nameIt(s){const out=String(s??"").replace(/\{nome\}/g,displayName());return out.charAt(0).toUpperCase()+out.slice(1)}
function scrubName(txt){
  if(!S.nome)return txt;
  return txt.replace(new RegExp(S.nome.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi"),"{nome}");
}
function profileForAI(){
  const label={yes:t("aYes"),no:t("aNo"),idk:t("aIdk")};
  const out=S.answers.map(a=>({q:a.q,a:a.a.map(scrubName)}));
  S.swipes.forEach(s=>out.push({q:s.q,a:[label[s.a]]}));
  if(S.openAnswer)out.push({q:S.openAnswer.q,a:[scrubName(S.openAnswer.a)]});
  return out;
}

/* Chiede al nostro server (/api/ai): la chiave API e i prompt restano sul server.
   Se l'AI non è disponibile il server risponde in modalità demo ("demo": true).
   Se anche il server non risponde, la pagina usa le poche domande e idee di riserva qui sotto. */
async function askAI(body){
  let res,data=null;
  try{
    res=await fetch("/api/ai",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...body,lingua:lang})});
    data=await res.json().catch(()=>null);
  }catch(e){const err=new Error("network");err.offline=true;throw err}
  if(res.ok&&data&&typeof data==="object"){if(data.demo)setDemo(true);return data}
  const err=new Error((data&&data.errore)||"ai");err.offline=res.status!==502;throw err;
}

/* ===================== Domande base (con i pulsanti) ===================== */
function startQuestions(){
  Object.assign(S,{mode:"fixed",answers:[],current:null,nome:"",nameDone:false,round:0,qdeck:[],swipes:[],asked:[],open:null,openAnswer:null,prefetch:null,loadingQ:false,errorQ:false,
    deck:[],shown:[],liked:[],disliked:[],history:[],loadingGifts:false,portrait:null,badges:[],score:null});
  S.genId++;updateLikes();nextQuestion();
}
function nextQuestion(){
  const n=S.answers.length;
  if(n<3){S.mode="fixed";S.current={...t("fixed")[n]};renderQuestion();return}
  if(!S.nameDone){askName();return}
  startRound(1);
}
function renderDots(step,total){
  $("dots").innerHTML=Array.from({length:total},(_,i)=>`<i class="${i<step?"done":""}"></i>`).join("");
  $("qnum").textContent=t("qOf")(Math.min(step+1,total),total);
}
function renderQuestion(){
  show("sQ"); renderDots(S.answers.length,4); $("qBack").style.visibility="visible";
  const q=S.current; q.sel=q.sel||new Set();
  $("qbody").innerHTML=`<div class="qemoji">${esc(q.emoji)}</div><h2>${esc(q.question)}</h2><p class="qhint">${esc(q.hint)}</p>
    <div class="opts">${q.options.map((o,i)=>`<button class="opt${q.sel.has(o)?" on":""}" data-k="${i}">${esc(o)}</button>`).join("")}</div>
    <div class="free"><input id="freeIn" placeholder="${esc(t("other"))}" maxlength="80" autocomplete="off"></div>`;
  $("qbody").querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const o=q.options[+b.dataset.k];
    if(q.multi){q.sel.has(o)?q.sel.delete(o):q.sel.add(o);renderQuestion();}
    else{q.sel=new Set([o]);commitAnswer();}
  });
  const fi=$("freeIn"); fi.oninput=updateNext; fi.onkeydown=e=>{if(e.key==="Enter"&&!$("qNext").disabled)commitAnswer()};
  $("qSkip").style.visibility="hidden";
  updateNext();
}
function updateNext(){
  const fi=$("freeIn"), txt=fi&&fi.value.trim();
  if(S.mode==="fixed"){const q=S.current;$("qNext").disabled=!(q&&(q.sel.size||txt))}
  else if(S.mode==="name")$("qNext").disabled=!txt;
  else $("qNext").disabled=!txt;
}
function commitAnswer(){
  const q=S.current;const fi=$("freeIn");const a=[...q.sel];
  if(fi&&fi.value.trim())a.push(fi.value.trim());
  if(!a.length)return;
  S.answers.push({q:q.question,a,emoji:q.emoji});S.current=null;nextQuestion();
}
function goBack(){
  if(S.mode==="name"){const last=S.answers.pop();S.mode="fixed";S.current={...t("fixed")[S.answers.length],sel:new Set(last?last.a:[])};renderQuestion();return}
  if(S.mode!=="fixed")return;
  if(!S.answers.length){show("sHome");return}
  const last=S.answers.pop();
  S.current={...t("fixed")[S.answers.length],sel:new Set(last.a)};
  renderQuestion();
}

/* ===================== Nome (resta sul telefono) ===================== */
function askName(){
  S.mode="name"; show("sQ"); renderDots(3,4); $("qBack").style.visibility="visible";
  $("qbody").innerHTML=`<div class="qemoji">🦊</div><h2>${esc(t("nameQ"))}</h2><p class="qhint">${esc(t("nameHint"))}</p>
    <div class="free"><input id="freeIn" placeholder="${esc(t("namePh"))}" maxlength="30" autocomplete="off" value="${esc(S.nome)}"></div>`;
  const fi=$("freeIn"); fi.oninput=updateNext; fi.onkeydown=e=>{if(e.key==="Enter"&&!$("qNext").disabled)onNext()};
  $("qSkip").textContent=t("nameSkip"); $("qSkip").style.visibility="visible";
  updateNext(); setTimeout(()=>fi.focus(),50);
}
function onNext(){
  if(S.mode==="fixed")return commitAnswer();
  const v=$("freeIn").value.trim(); if(!v)return;
  if(S.mode==="name"){S.nome=v.replace(/[{}]/g,"");S.nameDone=true;startRound(1);return}
  if(S.mode==="open"){S.openAnswer={q:S.open.question,a:v};startRound(2)}
}
function onSkip(){
  if(S.mode==="name"){S.nome="";S.nameDone=true;startRound(1);return}
  if(S.mode==="open"){S.openAnswer=null;startRound(2)}
}

/* ===================== Il gioco: domande da scorrere ===================== */
function loadRound(r){
  return askAI({tipo:"domande",giro:r,risposte:profileForAI(),chieste:S.asked})
    .catch(e=>{if(!e.offline)throw e;setDemo(true);return localRound(r)});
}
async function startRound(r){
  S.mode="swipe"; S.round=r; S.qdeck=[]; S.errorQ=false; S.loadingQ=true;
  show("sSwipe"); renderQDeck();
  const gen=S.genId;
  try{
    const data=(S.prefetch&&S.prefetch.r===r)?await S.prefetch.p:await loadRound(r);
    if(gen!==S.genId)return;
    S.prefetch=null;
    const qs=(data.questions||[]).filter(q=>q&&q.question);
    if(!qs.length)throw new Error("bad");
    qs.forEach(q=>S.asked.push(q.question));
    S.qdeck=qs.map(q=>({...q,round:r}));
    if(r===1&&data.open_question&&data.open_question.question)S.open=data.open_question;
  }catch(e){S.prefetch=null;S.errorQ=true}
  S.loadingQ=false; renderQDeck();
}
function qCardHTML(q,i,total){
  return `<div class="qart">
      <div class="qmeta"><b>${esc(t("round")(q.round))}</b><span>${i} / ${total}</span></div>
      <span class="em">${esc(q.emoji||"🦊")}</span>
      <h3>${esc(nameIt(q.question))}</h3>
      <div class="stamp yes">${t("yes")}</div><div class="stamp no">${t("no")}</div><div class="stamp idk">${t("idk")}</div>
    </div>`;
}
function renderQDeck(){
  const el=$("qdeck"); el.innerHTML="";
  $("qEnough").classList.toggle("on",S.swipes.length>=MIN_SWIPES);
  if(!S.qdeck.length){
    el.innerHTML=S.errorQ
      ?`<div class="loading-card">${foxSVG}<p class="err">${t("errAI")}</p><button class="cta ghost" id="retryQ">${t("retry")}</button></div>`
      :`<div class="loading-card">${foxSVG}<p style="font-family:var(--display);font-size:19px;font-weight:700;color:var(--snow)">${t(S.round===2?"loadQ2":"loadQ1")}</p><small>${esc(nameIt(t("loadQSub")))}</small></div>`;
    const rb=$("retryQ"); if(rb)rb.onclick=()=>startRound(S.round);
    return;
  }
  const done=S.swipes.filter(s=>s.round===S.round).length, total=done+S.qdeck.length;
  S.qdeck.slice(0,3).reverse().forEach((q,i,arr)=>{
    const depth=arr.length-1-i, c=document.createElement("div");
    c.className="card qcard"+(q.round===2?" r2":""); c.innerHTML=qCardHTML(q,done+depth+1,total);
    c.style.transform=`translateY(${depth*12}px) scale(${1-depth*.045})`; c.style.zIndex=10-depth;
    if(depth>0)c.style.filter=`brightness(${1-depth*.18})`;
    if(depth===0)attachDrag(c,swipeQ,{yes:".stamp.yes",no:".stamp.no",up:".stamp.idk"});
    el.appendChild(c);
  });
}
function swipeQ(dir){
  if(!S.qdeck.length)return;
  const a=dir==="super"?"idk":dir;
  const q=S.qdeck[0], card=document.querySelector("#qdeck .card:last-child");
  flyOut(card,dir,a==="idk"?".stamp.idk":`.stamp.${a}`);
  S.swipes.push({q:q.question,a,round:q.round});
  toast(nameIt(a==="yes"?q.yes_reaction:a==="no"?q.no_reaction:pick(t("idkReact"))),1500);
  S.qdeck.shift();
  setTimeout(()=>{renderQDeck();if(!S.qdeck.length&&!S.loadingQ)endRound()},240);
}
function endRound(){
  if(S.round===1){
    // Il round 2 si prepara subito, mentre l'utente risponde alla domanda aperta
    S.prefetch={r:2,p:loadRound(2)};
    if(S.open){askOpen();return}
    startRound(2);return;
  }
  showScore();
}
function askOpen(){
  S.mode="open"; show("sQ");
  $("dots").innerHTML=""; $("qnum").textContent=""; $("qBack").style.visibility="hidden";
  const q=S.open;
  $("qbody").innerHTML=`<div class="qemoji">${esc(q.emoji||"🔍")}</div><h2>${esc(nameIt(q.question))}</h2><p class="qhint">${esc(nameIt(q.hint))}</p>
    <div class="free"><input id="freeIn" placeholder="${esc(t("openPh"))}" maxlength="150" autocomplete="off"></div>`;
  const fi=$("freeIn"); fi.oninput=updateNext; fi.onkeydown=e=>{if(e.key==="Enter"&&!$("qNext").disabled)onNext()};
  $("qSkip").textContent=t("openSkip"); $("qSkip").style.visibility="visible";
  updateNext(); setTimeout(()=>fi.focus(),50);
}

/* ===================== Conosciometro ===================== */
function computeScore(){
  const n=S.swipes.length; if(!n)return 0;
  return Math.round(S.swipes.filter(s=>s.a!=="idk").length/n*100);
}
function showScore(){
  S.mode="score"; show("sScore");
  const p=computeScore(); S.score=p;
  $("scoreTitle").textContent=nameIt(t("scoreTitle"));
  $("scoreLevel").textContent=nameIt(t("levels").find(([min])=>p>=min)[1]);
  // il numero sale fino al punteggio
  const ring=$("ring"); let v=0; clearInterval(showScore.timer);
  showScore.timer=setInterval(()=>{v=Math.min(p,v+2);ring.style.setProperty("--p",v);$("scorePct").textContent=v+"%";if(v>=p)clearInterval(showScore.timer)},18);
  renderPortrait();
  if(!S.deck.length&&!S.loadingGifts)fetchGifts();
}
function renderPortrait(){
  const el=$("portrait");
  el.style.display=S.portrait&&!S.portrait.trim()?"none":"";
  if(S.portrait){el.classList.remove("wait");el.innerHTML=`${foxSVG}<span>${esc(nameIt(S.portrait))}</span>`}
  else{el.classList.add("wait");el.innerHTML=`${foxSVG}<span>${esc(t("portraitWait"))}</span>`}
  $("badges").innerHTML=S.badges.map(b=>`<span>${esc(nameIt(b))}</span>`).join("");
}
async function share(){
  const text=t("shareText")(S.score??computeScore(),displayName()), url=location.origin+"/";
  try{ if(navigator.share){await navigator.share({title:"Gifty",text,url});return} }catch(e){return}
  try{await navigator.clipboard.writeText(text+" "+url);toast(t("copied"))}catch(e){}
}

/* ===================== Regali ===================== */
function startGifts(){S.mode="gifts";show("sDeck");renderDeck();if(!S.deck.length&&!S.loadingGifts)fetchGifts()}

async function fetchGifts(){
  if(S.loadingGifts)return; S.loadingGifts=true; renderDeck();
  const gen=++S.genId;
  try{
    let r;
    try{
      r=await askAI({tipo:"regali",risposte:profileForAI(),
        piaciute:S.liked.map(l=>l.g.name),scartate:S.disliked.map(g=>g.name),mostrate:S.shown});
    }catch(e){if(!e.offline)throw e;setDemo(true);r={gifts:localGifts(),portrait:"",badges:[]}}
    if(gen!==S.genId)return;
    if(!S.portrait&&r.portrait){S.portrait=r.portrait;S.badges=(r.badges||[]).slice(0,3);renderPortrait()}
    (r.gifts||[]).filter(g=>g&&g.name).forEach(g=>{S.shown.push(g.name);S.deck.push(g)});
  }catch(e){
    if(gen!==S.genId)return;
    S.error=true;
  }
  if(!S.portrait){S.portrait=" ";renderPortrait()}
  S.loadingGifts=false; renderDeck();
}

function cardHTML(g){
  const c1=hex(g.colors&&g.colors[0])||"#3a2414", c2=hex(g.colors&&g.colors[1])||"#ff7a2f";
  const price=Number(g.price), f=g.foto&&/^https:\/\/images\.pexels\.com\//.test(g.foto.url)?g.foto:null;
  const bg=f?`background:url('${esc(f.url)}') center/cover,${c1}`
    :`background:radial-gradient(circle at 30% 25%,${c2} 0%,transparent 58%),radial-gradient(circle at 85% 90%,${c2}88 0%,transparent 45%),linear-gradient(160deg,${c1},#0e1a16)`;
  return `<div class="art${f?" photo":""}" style="${bg}">
      <span class="new-tag">${t("new")}</span>${isFinite(price)&&price>0?`<span class="price-tag">€ ${Math.round(price)}</span>`:""}
      <span class="em">${esc(g.emoji||"🎁")}</span>
      ${f?`<a class="credit" href="${esc(f.link)}" target="_blank" rel="noopener">📷 ${esc(f.autore||t("photo"))} · Pexels</a>`:""}
      <div class="stamp yes">${t("yes")}</div><div class="stamp no">${t("no")}</div><div class="stamp super">${t("perfect")}</div>
    </div>
    <div class="info">
      <h3>${esc(nameIt(g.name))}</h3>${g.tagline?`<div class="tl">${esc(nameIt(g.tagline))}</div>`:""}
      <p>${esc(nameIt(g.description))}</p>
      ${g.why?`<div class="why"><svg viewBox="0 0 64 64"><use href="#fox"/></svg><span>${esc(nameIt(g.why))}</span></div>`:""}
      ${Array.isArray(g.tags)&&g.tags.length?`<div class="tags">${g.tags.slice(0,3).map(x=>`<span class="tag">${esc(x)}</span>`).join("")}</div>`:""}
    </div>`;
}

function renderDeck(){
  const el=$("deck"); el.innerHTML="";
  if(!S.deck.length){
    el.innerHTML=S.error&&!S.loadingGifts
      ?`<div class="loading-card">${foxSVG}<p class="err">${t("errAI")}</p><button class="cta ghost" id="retryG">${t("retry")}</button></div>`
      :`<div class="loading-card">${foxSVG}<p style="font-family:var(--display);font-size:19px;font-weight:700;color:var(--snow)">${t("thinkingG")}</p><small>${t("thinkingSub")}</small></div>`;
    const rb=$("retryG"); if(rb) rb.onclick=()=>{S.error=false;fetchGifts()};
    return;
  }
  // le foto delle prossime carte si caricano in anticipo
  S.deck.slice(0,5).forEach(g=>{if(g.foto&&g.foto.url){const im=new Image();im.src=g.foto.url}});
  S.deck.slice(0,3).reverse().forEach((g,i,arr)=>{
    const depth=arr.length-1-i, c=document.createElement("div");
    c.className="card"; c.innerHTML=cardHTML(g);
    c.style.transform=`translateY(${depth*12}px) scale(${1-depth*.045})`; c.style.zIndex=10-depth;
    if(depth>0)c.style.filter=`brightness(${1-depth*.18})`;
    if(depth===0)attachDrag(c,swipe,{yes:".stamp.yes",no:".stamp.no",up:".stamp.super"});
    el.appendChild(c);
  });
  if(S.deck.length<=2&&!S.loadingGifts){S.error=false;fetchGifts()}
}

/* Trascinamento di una carta: a destra "yes", a sinistra "no", in alto "super" */
function attachDrag(card,onSwipe,stamps){
  let sx=0,sy=0,dx=0,dy=0,drag=false;
  const st={yes:card.querySelector(stamps.yes),no:card.querySelector(stamps.no),sup:card.querySelector(stamps.up)};
  card.addEventListener("pointerdown",e=>{if(e.target.closest("a"))return;drag=true;sx=e.clientX;sy=e.clientY;card.setPointerCapture(e.pointerId);card.style.transition="none"});
  card.addEventListener("pointermove",e=>{
    if(!drag)return; dx=e.clientX-sx; dy=e.clientY-sy;
    card.style.transform=`translate(${dx}px,${dy}px) rotate(${dx/16}deg)`;
    st.yes.style.opacity=Math.max(0,dx/110); st.no.style.opacity=Math.max(0,-dx/110);
    st.sup.style.opacity=Math.abs(dx)<60?Math.max(0,-dy/110):0;
  });
  const end=()=>{
    if(!drag)return; drag=false;
    if(dx>110)onSwipe("yes"); else if(dx<-110)onSwipe("no"); else if(dy<-110&&Math.abs(dx)<80)onSwipe("super");
    else{card.style.transition="transform .3s cubic-bezier(.2,1.4,.4,1)";card.style.transform="";Object.values(st).forEach(s=>s.style.opacity=0)}
    dx=dy=0;
  };
  card.addEventListener("pointerup",end); card.addEventListener("pointercancel",end);
}
function flyOut(card,dir,stampSel){
  if(!card)return;
  const x=dir==="yes"?640:dir==="no"?-640:0, y=dir==="super"?-900:80;
  card.style.transition="transform .38s ease-in, opacity .38s";
  card.style.transform=`translate(${x}px,${y}px) rotate(${x/18}deg)`; card.style.opacity="0";
  const s=card.querySelector(stampSel); if(s)s.style.opacity=1;
}

function swipe(dir){
  if(!S.deck.length)return;
  const g=S.deck[0], card=document.querySelector("#deck .card:last-child");
  flyOut(card,dir,`.stamp.${dir}`);
  S.history.push({g,dir});
  if(dir==="no")S.disliked.push(g); else {S.liked.push({g,sup:dir==="super",i:S.liked.length}); toast(dir==="super"?t("super"):t("saved"));}
  S.deck.shift(); updateLikes();
  // se l'utente ha dato un segnale forte, rigenera presto idee in quella direzione
  if(dir==="super"&&S.deck.length<=4&&!S.loadingGifts)fetchGifts();
  setTimeout(renderDeck,240);
}
function undo(){
  const h=S.history.pop(); if(!h)return;
  if(h.dir==="no")S.disliked=S.disliked.filter(g=>g!==h.g); else S.liked=S.liked.filter(l=>l.g!==h.g);
  S.deck.unshift(h.g); updateLikes(); renderDeck();
}
function updateLikes(){$("likesN").textContent=S.liked.length}

/* ===================== Risultati ===================== */
function showResults(){
  show("sRes");
  const ranked=[...S.liked].sort((a,b)=>(b.sup-a.sup)||(b.i-a.i));
  $("resSub").textContent=ranked.length?t("resSub")(ranked.length):t("resNone");
  $("resScore").textContent=S.score!=null?t("resScore")(S.score,displayName()):"";
  $("list").innerHTML=ranked.map((l,i)=>{
    const g=l.g, c1=hex(g.colors&&g.colors[0])||"#3a2414", c2=hex(g.colors&&g.colors[1])||"#ff7a2f";
    const f=g.foto&&/^https:\/\/images\.pexels\.com\//.test(g.foto.url)?g.foto:null;
    const q=encodeURIComponent(g.search||g.name);
    const thumb=f?`<div class="e photo" style="background:url('${esc(f.url)}') center/cover"></div>`
      :`<div class="e" style="background:linear-gradient(150deg,${c2},${c1})">${esc(g.emoji||"🎁")}</div>`;
    return `<div class="row${i===0?" top":""}">${thumb}
      <div><h4>${esc(nameIt(g.name))}</h4><div class="meta">${Number(g.price)>0?`<span class="pr">€ ${Math.round(g.price)}</span>`:""}${l.sup?`<span class="badge">${t("super")}</span>`:""}</div>
      <p>${esc(nameIt(g.why||g.description))}</p><a href="https://www.google.com/search?tbm=shop&q=${q}" target="_blank" rel="noopener">${t("search")}</a></div></div>`;
  }).join("");
}
